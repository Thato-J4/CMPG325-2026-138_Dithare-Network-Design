<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Logical Topology — IP Addressing &amp; NAT Boundary (CLI-138)</text>

  <!-- Outside cloud -->
  <ellipse cx="500" cy="90" rx="150" ry="45" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold">Internet / ISP</text>
  <text x="500" y="102" text-anchor="middle" font-size="11" fill="#475569">203.0.113.0/30</text>

  <line x1="500" y1="135" x2="500" y2="170" stroke="#334155" stroke-width="2"/>

  <!-- NAT boundary box -->
  <rect x="330" y="170" width="340" height="90" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="500" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#0369a1">Edge Router R1 — NAT (PAT/Overload)</text>
  <text x="500" y="208" text-anchor="middle" font-size="11">Outside: G0/0 = 203.0.113.1 (ip nat outside)</text>
  <text x="500" y="224" text-anchor="middle" font-size="11">Inside: subints on G0/1 (ip nat inside)</text>
  <text x="500" y="242" text-anchor="middle" font-size="10" fill="#0369a1">Translates: VLAN 10 + VLAN 99 only (ACL 1)</text>

  <line x1="500" y1="260" x2="500" y2="295" stroke="#334155" stroke-width="2"/>
  <text x="640" y="282" font-size="10" fill="#64748b">Inter-VLAN routing (router-on-a-stick)</text>

  <!-- Router-on-stick node -->
  <rect x="440" y="295" width="120" height="40" rx="6" fill="#eef2f7" stroke="#334155"/>
  <text x="500" y="320" text-anchor="middle" font-size="11" font-weight="bold">G0/1 (trunk)</text>

  <!-- 4 subinterface branches -->
  <line x1="500" y1="335" x2="160" y2="390" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="335" x2="380" y2="390" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="335" x2="620" y2="390" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="335" x2="840" y2="390" stroke="#334155" stroke-width="1.5"/>

  <!-- VLAN 10 -->
  <rect x="60" y="390" width="200" height="100" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="160" y="412" text-anchor="middle" font-size="12" font-weight="bold">VLAN 10 — Office</text>
  <text x="160" y="430" text-anchor="middle" font-size="10">192.168.59.0/27</text>
  <text x="160" y="446" text-anchor="middle" font-size="10">Gw: 192.168.59.1</text>
  <text x="160" y="462" text-anchor="middle" font-size="10" fill="#166534">NAT: YES (inside)</text>
  <text x="160" y="478" text-anchor="middle" font-size="10">Internet: Allowed</text>

  <!-- VLAN 20 -->
  <rect x="280" y="390" width="200" height="100" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="380" y="412" text-anchor="middle" font-size="12" font-weight="bold">VLAN 20 — CCTV</text>
  <text x="380" y="430" text-anchor="middle" font-size="10">192.168.59.32/27</text>
  <text x="380" y="446" text-anchor="middle" font-size="10">Gw: 192.168.59.33</text>
  <text x="380" y="462" text-anchor="middle" font-size="10" fill="#b91c1c">NAT: NO</text>
  <text x="380" y="478" text-anchor="middle" font-size="10">Blocked from VLAN 10/30 (ACL)</text>

  <!-- VLAN 30 -->
  <rect x="520" y="390" width="200" height="100" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="620" y="412" text-anchor="middle" font-size="12" font-weight="bold">VLAN 30 — IoT (CR12)</text>
  <text x="620" y="430" text-anchor="middle" font-size="10">192.168.59.64/27</text>
  <text x="620" y="446" text-anchor="middle" font-size="10">Gw: 192.168.59.65</text>
  <text x="620" y="462" text-anchor="middle" font-size="10" fill="#6d28d9">NAT: NO</text>
  <text x="620" y="478" text-anchor="middle" font-size="10">Blocked from VLAN 10/20 (ACL)</text>

  <!-- VLAN 99 -->
  <rect x="740" y="390" width="200" height="100" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="840" y="412" text-anchor="middle" font-size="12" font-weight="bold">VLAN 99 — Management</text>
  <text x="840" y="430" text-anchor="middle" font-size="10">192.168.59.96/27</text>
  <text x="840" y="446" text-anchor="middle" font-size="10">Gw: 192.168.59.97</text>
  <text x="840" y="462" text-anchor="middle" font-size="10" fill="#166534">NAT: YES (inside)</text>
  <text x="840" y="478" text-anchor="middle" font-size="10">Switch/Router mgmt only</text>

  <!-- ACL note -->
  <rect x="60" y="520" width="880" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="542" font-size="11" fill="#334155">Segmentation enforcement: Extended ACL 101 applied inbound on VLAN 20 and VLAN 30 subinterfaces</text>
  <text x="80" y="558" font-size="11" fill="#334155">denies traffic destined to 192.168.59.0/27 (Office), satisfying the design constraint and CR12 isolation requirement.</text>

  <rect x="60" y="595" width="880" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="615" font-size="11" fill="#334155">NAT enforcement: ip nat inside source list 1 interface G0/0 overload — ACL 1 permits only</text>
  <text x="80" y="630" font-size="11" fill="#334155">192.168.59.0/27 and 192.168.59.96/27 as translatable inside sources.</text>
</svg>
