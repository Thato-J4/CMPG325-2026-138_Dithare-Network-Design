<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Physical Topology — Dithare Car Wash &amp; Detailing Group (CLI-138)</text>

  <!-- ISP Router -->
  <rect x="430" y="60" width="140" height="60" rx="6" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="500" y="85" text-anchor="middle" font-size="13" font-weight="bold">ISP Router</text>
  <text x="500" y="102" text-anchor="middle" font-size="11" fill="#475569">G0/0: 203.0.113.2</text>

  <!-- link -->
  <line x1="500" y1="120" x2="500" y2="165" stroke="#334155" stroke-width="2"/>
  <text x="512" y="145" font-size="10" fill="#64748b">Serial/WAN link</text>

  <!-- Edge Router -->
  <rect x="410" y="165" width="180" height="70" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="500" y="192" text-anchor="middle" font-size="13" font-weight="bold">Edge Router (R1)</text>
  <text x="500" y="208" text-anchor="middle" font-size="11" fill="#0369a1">G0/0 (outside) — G0/1 (trunk)</text>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#0369a1">NAT + Inter-VLAN Routing</text>

  <!-- link to switch -->
  <line x1="500" y1="235" x2="500" y2="280" stroke="#334155" stroke-width="2"/>
  <text x="512" y="260" font-size="10" fill="#64748b">Trunk (802.1Q)</text>

  <!-- L2 Switch -->
  <rect x="380" y="280" width="240" height="60" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="500" y="305" text-anchor="middle" font-size="13" font-weight="bold">Access Switch (SW1)</text>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#15803d">Access ports per VLAN, trunk to R1</text>

  <!-- drop lines to 3 groups -->
  <line x1="500" y1="340" x2="180" y2="400" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="340" x2="500" y2="400" stroke="#334155" stroke-width="1.5"/>
  <line x1="500" y1="340" x2="820" y2="400" stroke="#334155" stroke-width="1.5"/>

  <!-- Office group -->
  <rect x="80" y="400" width="200" height="46" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="180" y="428" text-anchor="middle" font-size="12" font-weight="bold">VLAN 10 — Office PCs</text>
  <rect x="100" y="470" width="60" height="40" fill="#fefce8" stroke="#a16207"/>
  <text x="130" y="495" text-anchor="middle" font-size="10">PC-1</text>
  <rect x="200" y="470" width="60" height="40" fill="#fefce8" stroke="#a16207"/>
  <text x="230" y="495" text-anchor="middle" font-size="10">PC-2</text>
  <line x1="180" y1="446" x2="130" y2="470" stroke="#334155"/>
  <line x1="180" y1="446" x2="230" y2="470" stroke="#334155"/>

  <!-- CCTV group -->
  <rect x="400" y="400" width="200" height="46" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="500" y="428" text-anchor="middle" font-size="12" font-weight="bold">VLAN 20 — CCTV Cameras</text>
  <rect x="420" y="470" width="60" height="40" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="450" y="495" text-anchor="middle" font-size="10">CAM-1</text>
  <rect x="520" y="470" width="60" height="40" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="550" y="495" text-anchor="middle" font-size="10">CAM-2</text>
  <line x1="500" y1="446" x2="450" y2="470" stroke="#334155"/>
  <line x1="500" y1="446" x2="550" y2="470" stroke="#334155"/>

  <!-- IoT group -->
  <rect x="720" y="400" width="200" height="46" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="820" y="428" text-anchor="middle" font-size="12" font-weight="bold">VLAN 30 — IoT Sensors (CR12)</text>
  <rect x="740" y="470" width="60" height="40" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="770" y="495" text-anchor="middle" font-size="10">IoT-1</text>
  <rect x="840" y="470" width="60" height="40" fill="#f5f3ff" stroke="#6d28d9"/>
  <text x="870" y="495" text-anchor="middle" font-size="10">IoT-2</text>
  <line x1="820" y1="446" x2="770" y2="470" stroke="#334155"/>
  <line x1="820" y1="446" x2="870" y2="470" stroke="#334155"/>

  <!-- Legend -->
  <rect x="60" y="550" width="880" height="50" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="572" font-size="11" fill="#334155">Legend: Solid lines = physical cabling. Trunk link carries VLANs 10, 20, 30, 99 (802.1Q tagged).</text>
  <text x="80" y="589" font-size="11" fill="#334155">Management VLAN (99) not shown as a device group — used for switch/router remote management only.</text>
</svg>
